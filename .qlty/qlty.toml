config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "trufflehog"

# T-010: linters for the Python stack beside the secret scanner. ruff reads ruff.toml; bandit runs on the application
# and the engine. R-008 (the Cloud-side `qlty check` fault) is unaffected by this file and stays open.
[[plugin]]
name = "ruff"
# Same ruff as uv.lock. Without a version qlty runs its own default (0.14.6),
# which cannot parse target-version = "py315" in ruff.toml (the Python 3.15
# move, HCW-HybridCloudWorks#1707) and then reports the whole qlty build as
# "Build errored". Move this with uv.lock.
version = "0.17.4"

[[plugin]]
name = "bandit"
