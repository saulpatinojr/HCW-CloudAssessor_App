name: Bug report
description: The assessment got something wrong or could not do something. The appliance, the engine, the catalog, the images, the Terraform or the CI does not work as expected.
title: "[Bug]: "
labels:
  - bug
  - product:cloudassessor
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please search the existing issues first.
        **Redact before you paste.** Do not paste credentials, tokens, tenant, subscription, resource-group or resource
        identifiers, or customer data. Replace a subscription id with `00000000-0000-0000-0000-000000000001`.
        A security problem is not a bug report: use the private route in
        [SECURITY.md](https://github.com/saulpatinojr/HCW-CloudAssessor_App/blob/main/.github/SECURITY.md).

  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I removed every credential, token and tenant, subscription or resource identifier from this report.
          required: true

  - type: input
    id: summary
    attributes:
      label: Bug summary
      description: One sentence on what is wrong.
      placeholder: "The cost criteria report 'not assessed' although cost data is enabled"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Choose the closest one.
      options:
        - Engine (packages/cloud-assessor-core)
        - Criteria catalog (packages/cloud-assessor-core/catalog)
        - Appliance API and collectors (src/cloud_assessor_appliance)
        - Appliance pane (the web page)
        - Container images and the image build (infrastructure/docker)
        - Terraform deployment (infrastructure/terraform/appliance-azure)
        - CI, workflows and repository policy (.github)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: environment_kind
    attributes:
      label: Where did you see it
      options:
        - Deployed appliance (container image)
        - Appliance run locally (az login)
        - Engine installed from a release wheel
        - CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Say what you did and what went wrong, in plain words. Include the exact error text when you have it.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: One action per line, with the exact command or page.
      placeholder: |
        1. Start the appliance with ...
        2. Open ...
        3. See the failure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The `version` and `catalog.version` that `GET /api/health` reports, the release tag, or the commit.
      placeholder: "version 0.3.0, catalog 1.1.0"

  - type: input
    id: scope
    attributes:
      label: Assessment scope in use
      description: Counts and kinds only (for example "1 subscription, 2 resource groups"). Never identifiers.

  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: The relevant part of `report.json`, `findings.csv` or the log lines. Remove anything private first.
      render: shell

  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
      description: Who or what is affected, and anything that works around it.
