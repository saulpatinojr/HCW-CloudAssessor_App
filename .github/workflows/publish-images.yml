# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Appliance image: docker.io/hybridcloudworks/hcw-cloud-assessor-appliance, published on v* tags by digest through the
# Docker OIDC connection (conventions-publishing.md): no DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets, workload identity
# only. Both Dockerfile targets are built; the `lab` boundary-proof target is RUN as a check and never pushed. Order:
# build -> boundary checks -> Trivy -> push with provenance + SBOM -> attest -> digest. A failing check publishes nothing.
# Until the owner creates the OIDC connection and sets DOCKERHUB_ENABLED=true / DOCKERHUB_CONNECTION=<uuid>, the push
# is skipped. A workflow_dispatch from a branch builds, proves and scans but never pushes: only a v* tag ref can.
name: publish-images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: docker.io/hybridcloudworks/hcw-cloud-assessor-appliance
jobs:
  build-scan-publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        name: Version from the tag (or the pyproject on manual runs)
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the lab boundary-proof target (local only, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, target: lab, load: true, push: false, tags: "hcw-cloud-assessor-lab:scan" }
      - name: Build the appliance target (local only, for the checks and the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, target: appliance, load: true, push: false, tags: "${{ env.IMAGE }}:scan" }
      - name: Boundary in both directions, non-root, no pip, startup refusals
        run: |
          set -euo pipefail
          docker run --rm hcw-cloud-assessor-lab:scan
          if docker run --rm hcw-cloud-assessor-lab:scan python -c "import azure"; then echo "::error::azure is importable in the lab target"; exit 1; fi
          docker run --rm "${IMAGE}:scan" python -c "import azure.identity"
          if docker run --rm "${IMAGE}:scan" python -m pip --version; then echo "::error::pip is present in the appliance image"; exit 1; fi
          test "$(docker run --rm "${IMAGE}:scan" id -u)" = "10001"
          if docker run --rm -e AZURE_CLIENT_SECRET=x -e CA_SCOPES=/subscriptions/00000000-0000-0000-0000-000000000001 "${IMAGE}:scan"; then echo "::error::started with a client secret"; exit 1; fi
          if docker run --rm "${IMAGE}:scan"; then echo "::error::started without CA_SCOPES"; exit 1; fi
      - name: Scan the appliance image before publishing (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ env.IMAGE }}:scan", exit-code: "1", severity: "HIGH,CRITICAL", ignore-unfixed: true }
      - name: Publishing is enabled (repository variables DOCKERHUB_ENABLED and DOCKERHUB_CONNECTION)
        id: gate
        env: { ENABLED: "${{ vars.DOCKERHUB_ENABLED }}", CONNECTION: "${{ vars.DOCKERHUB_CONNECTION }}" }
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then echo "push=false" >> "$GITHUB_OUTPUT"; echo "::notice::not a v* tag (${GITHUB_REF}); built, proved and scanned, never pushed from a branch"; exit 0; fi
          if [ "$ENABLED" != "true" ]; then echo "push=false" >> "$GITHUB_OUTPUT"; echo "::notice::DOCKERHUB_ENABLED is not 'true'; built, proved and scanned, not pushed"; exit 0; fi
          if ! [[ "$CONNECTION" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then echo "::error::DOCKERHUB_CONNECTION is not a UUID"; exit 1; fi
          echo "push=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: "900"
        with: { registry: docker.io, username: hybridcloudworks }
      - if: steps.gate.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/v')
        id: build
        name: Push the appliance target only, with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: appliance
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=hcw-cloud-assessor-appliance
            org.opencontainers.image.description=Hybrid Cloud Works Cloud Assessor, appliance edition (managed identity, read-only)
          provenance: true
          sbom: true
      - if: steps.gate.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/v')
        name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: steps.gate.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/v')
        name: Record the immutable digest for Terraform var.image_ref
        run: |
          {
            echo "## Published"
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "image_tag: ${{ steps.version.outputs.version }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
