# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
name: security
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "23 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-review:
    # Needs the Dependency graph enabled on the repository (Settings > Code security; T-010 note): until the owner
    # enables it the action fails with "Dependency review is not supported on this repository".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with: { fail-on-severity: moderate }
  codeql:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
      actions: read # codeql-action/analyze reads the workflow run's status; required on a private repository
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with: { category: "/language:${{ matrix.language }}" }
  secret-scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the pull request's commits; without this it fails with "Resource not accessible by integration"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  pip-audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.15" }
      - run: python -m pip install "uv==0.13.8"
      - run: uv sync --frozen --all-packages
      - name: Known vulnerabilities in both runtime locks (the only inputs the images install)
        run: |
          uv run pip-audit -r requirements.lock.txt --strict
          uv run pip-audit -r requirements-azure.lock.txt --strict
