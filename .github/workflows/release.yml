# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Creates the GitHub Release for a v* tag from the matching CHANGELOG.md section (publish-core.yml attaches the wheel;
# publish-images.yml prints the appliance digest in its summary). Uses gh with GITHUB_TOKEN; no third-party action.
# Two jobs, so the write permission exists only where a release is really created:
#   check   (contents: read)  the tag, every package version, the changelog and the tagged commit must agree
#                             (scripts/check-release-version.py; a v* tag can never be moved or deleted, so this is the
#                             last chance to stop a wrong one). Nothing is created before it passes.
#   create  (contents: write) the release notes are the CHANGELOG.md section for the version; a release that exists is left alone.
# The versioning policy (one version for the engine, the appliance and the image) is in README.md "Releasing and versioning".
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - name: The tag, the versions and the changelog agree (before any release is created)
        env: { REF_NAME: "${{ github.ref_name }}" }
        run: python scripts/check-release-version.py --tag "$REF_NAME" --ancestor-of origin/main
  create:
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.14" }
      - name: Release notes from CHANGELOG.md
        env: { REF_NAME: "${{ github.ref_name }}" }
        run: python scripts/check-release-version.py --tag "$REF_NAME" --notes-out release-notes.md
      - name: Create the release (idempotent)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}", TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          tag="$TAG"
          if gh release view "$tag" >/dev/null 2>&1; then echo "release $tag exists"; exit 0; fi
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
