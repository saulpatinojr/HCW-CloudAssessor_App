# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Runners: ubuntu-26.04, never ubuntu-latest (program convention). uv is installed with pip at the exact version this
# repository was authored with, because astral-sh/setup-uv is pinned nowhere in scope (conventions-actions.md).
# Jobs: lint (ruff, catalog, docs governance, release version agreement, versions.env, lockfile exports, startup refusal
# without the azure extra),
# test (85 percent coverage gate, with the azure extra), catalog-check, boundary (security + packaging suites on the
# default set), terraform (fmt, validate, test), image (both targets built; the lab target's CMD is the boundary proof).
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.14"
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check-catalog.py
      - run: uv run python scripts/check-docs-governance.py
      - name: Every place that names the release version agrees (a v* tag can never be corrected)
        run: uv run python scripts/check-release-version.py
      - run: bash scripts/check-versions.sh
      - run: bash scripts/check-lockfiles.sh
      - name: The appliance refuses to start without the azure extra (default set)
        run: |
          set +e
          CA_SCOPES=/subscriptions/00000000-0000-0000-0000-000000000001 uv run python -m cloud_assessor_appliance
          code=$?
          set -e
          test "$code" -eq 3 && echo "refused as expected (exit $code)"
      - name: No ClientSecretCredential anywhere in the application
        run: |
          set -euo pipefail
          if grep -rn "ClientSecretCredential\|CertificateCredential\|UsernamePasswordCredential" src packages; then echo "::error::a client-secret credential path exists"; exit 1; fi
          echo "managed identity only"
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages --extra azure
      - name: Unit, security and packaging tests with the 85 percent coverage gate
        run: uv run pytest -q --cov=packages --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, if-no-files-found: error }
  catalog-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages
      - run: uv run python scripts/check-catalog.py
      - name: schema.json is generated from the model (drift check)
        run: |
          set -euo pipefail
          cp packages/cloud-assessor-core/catalog/schema.json /tmp/schema.before.json
          uv run python scripts/check-catalog.py --write-schema
          diff -u /tmp/schema.before.json packages/cloud-assessor-core/catalog/schema.json
  boundary:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --frozen --all-packages
      - name: Security and packaging suites on the default set (no cloud SDK installed)
        run: uv run pytest tests/security tests/packaging -q
  terraform:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_wrapper: false }
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/appliance-azure init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform/appliance-azure validate
      - name: Plan-only guard tests with mock providers (no login, no cloud call)
        run: terraform -chdir=infrastructure/terraform/appliance-azure test
  image:
    runs-on: ubuntu-26.04
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the lab boundary-proof target (never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, target: lab, load: true, push: false, tags: "hcw-cloud-assessor-lab:dev" }
      - name: Build the appliance target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, target: appliance, load: true, push: false, tags: "hcw-cloud-assessor-appliance:dev" }
      - name: Boundary proved at image level (section 20)
        run: |
          set -euo pipefail
          docker run --rm hcw-cloud-assessor-lab:dev
          if docker run --rm hcw-cloud-assessor-lab:dev python -c "import azure"; then echo "::error::azure is importable in the lab target"; exit 1; fi
          if docker run --rm hcw-cloud-assessor-lab:dev python -m pip --version; then echo "::error::pip is present in the lab target"; exit 1; fi
          docker run --rm hcw-cloud-assessor-appliance:dev python -c "import azure.identity, azure.mgmt.resourcegraph, azure.mgmt.costmanagement; print('appliance: azure extra present')"
          if docker run --rm hcw-cloud-assessor-appliance:dev python -m pip --version; then echo "::error::pip is present in the appliance image"; exit 1; fi
          test "$(docker run --rm hcw-cloud-assessor-appliance:dev id -u)" = "10001"
          if docker run --rm -e AZURE_CLIENT_SECRET=x -e CA_SCOPES=/subscriptions/00000000-0000-0000-0000-000000000001 hcw-cloud-assessor-appliance:dev; then echo "::error::the appliance started with a client secret in the environment"; exit 1; fi
          if docker run --rm hcw-cloud-assessor-appliance:dev; then echo "::error::the appliance started without CA_SCOPES"; exit 1; fi
          echo "boundary proved in both directions"
