# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# Runners: ubuntu-26.04, never ubuntu-latest (program convention). uv is installed with pip at the exact version this
# repository was authored with, because astral-sh/setup-uv is pinned nowhere in scope (conventions-actions.md).
# Jobs: lint (ruff, catalog, docs governance, release version agreement, versions.env, lockfile exports, startup refusal
# without the azure extra),
# test (85 percent coverage gate, with the azure extra), catalog-check, boundary (security + packaging suites on the
# default set), terraform (fmt, validate, test), image (both targets built; the lab target's CMD is the boundary proof).
name: ci
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_VERSION: "0.13.8"
  # The line only, as .python-version and `make setup` name it: setup-python hands out the newest 3.15.x it has, so an
  # exact pin here would fail whenever that newest patch and the pin differ.
  PYTHON_VERSION: "3.15"
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        # Also after an earlier failure (checkout is the only step before it), because the lint-tools
        # install below runs then too and makes zizmor's environment with python3.
        if: ${{ !cancelled() }}
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      # The uv check and the three linters run first, straight after setting up Python: no
      # repository code (uv sync builds this project's packages, ruff and the scripts run) has
      # run yet, so nothing in this pull request can rewrite .github on disk before it is read.
      # UV_VERSION is the one uv version (HCW-HybridCloudWorks#1707). The workflows listed below must name it
      # (the release and security ones literally, as the lab editions' do; dependabot-lockfiles.yml in its own env). Then every
      # workflow and composite action is read for another way of choosing uv: another version, operator, spacing or
      # extra, an install with no version, astral-sh/setup-uv, or another UV_VERSION value. A version worked out
      # while a job runs, or an install the patterns do not describe, is not seen.
      - name: Every workflow uses the uv this workflow uses
        run: |
          set -euo pipefail
          for f in .github/workflows/publish-core.yml .github/workflows/security.yml; do
            [ -f "$f" ] || { echo "::error::${f} is gone; update the list in this step"; exit 1; }
            grep -Fq "\"uv==${UV_VERSION}\"" "$f" || { echo "::error file=${f}::installs a uv other than ${UV_VERSION}"; exit 1; }
          done
          f=.github/workflows/dependabot-lockfiles.yml
          [ -f "$f" ] || { echo "::error::${f} is gone; update the list in this step"; exit 1; }
          grep -Fqx "  UV_VERSION: \"${UV_VERSION}\"" "$f" || { echo "::error file=${f}::UV_VERSION is not ${UV_VERSION}"; exit 1; }
          # Every workflow and composite action is then read line by line for: uv with a version operator, any
          # spacing or extras; pip, pipx or `uv tool` installing uv with no version; astral-sh/setup-uv; and
          # UV_VERSION given a value that starts with a digit or `$` (block, flow, quoted or shell form).
          q="[\"']?"
          re_pin='\buv(\[[A-Za-z0-9,_-]*\])?[[:space:]]*(===?|~=|>=|<=|!=|[<>])[[:space:]]*[0-9A-Za-z._{}$]+'
          re_bare="(pip3?|pipx|uv[[:space:]]+tool)[[:space:]]+install[[:space:]]+(-[^[:space:]]+[[:space:]]+)*${q}uv${q}([[:space:]]|\$)"
          re_action='astral-sh/setup[-]uv[@]'
          re_env="\\bUV_VERSION${q}[[:space:]]*[:=][[:space:]]*${q}[0-9\$][^\"'[:space:],}]*"
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml .github/actions/*/action.yml .github/actions/*/action.yaml)
          # Written to a file first, so a failing grep stops the step; exit 1 (no line matched) is allowed.
          pins="${RUNNER_TEMP}/uv-pins"
          grep -HnoE "${re_pin}|${re_bare}|${re_action}|${re_env}" "${files[@]}" > "$pins" || [ "$?" -eq 1 ]
          bad=0
          while IFS=: read -r f n pin; do
            case "$pin" in
              "uv==${UV_VERSION}") continue ;;
              "uv==\${UV_VERSION}")
                grep -Eq "$re_env" "$f" && continue
                pin="${pin} in a file that sets no UV_VERSION" ;;
              UV_VERSION*) [ "${pin##*[:= \"\']}" = "$UV_VERSION" ] && continue ;;
            esac
            echo "::error file=${f},line=${n}::${pin} is not uv ${UV_VERSION}"; bad=1
          done < "$pins"
          exit "$bad"

      # Workflow and Dockerfile linters (HCW-HybridCloudWorks#1575): the
      # same three tools, versions and digests as the website's CI. CodeRabbit
      # used to run them and was removed on 2026-11-06. Each tool is a pinned
      # release whose SHA-256 is written here; move a version and its digest
      # together. Each linter runs even when the one before it failed, so one
      # run shows every finding.
      - name: Install actionlint, hadolint and zizmor (pinned, digests checked)
        id: lint-tools
        # Runs after an earlier failure in this job too, so one run reports the
        # linters' findings beside whatever else failed.
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_VERSION: 2.14.0
          HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
          ZIZMOR_VERSION: 1.31.1
          ZIZMOR_SHA256: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/lint-tools"
          mkdir -p "$tools"
          cd "$tools"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 --retry-all-errors -o "$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          curl -sSfL --retry 3 --retry-all-errors -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod 0755 actionlint hadolint
          # zizmor in its own environment: one wheel, one hash, nothing else.
          python3 -m venv zizmor-env
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > zizmor-requirements.txt
          zizmor-env/bin/python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r zizmor-requirements.txt
          ln -s "$tools/zizmor-env/bin/zizmor" zizmor
          echo "$tools" >> "$GITHUB_PATH"

      - name: actionlint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          actionlint -version
          actionlint -color

      - name: zizmor
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          zizmor --version
          args=(--offline --format=github)
          if [ -f .github/zizmor.yml ]; then args+=(--config .github/zizmor.yml); fi
          # .github/actions too: the composite action there is handed the App key.
          zizmor "${args[@]}" .github/workflows .github/actions

      - name: hadolint
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          hadolint --version
          # Written to a file first, so a failing git stops the step (inside
          # `< <(...)` its failure would be lost and read as "none tracked").
          list="${RUNNER_TEMP}/dockerfiles"
          git ls-files -z -- ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*' ':(glob)**/*.Dockerfile' > "$list"
          mapfile -d '' files < "$list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no Dockerfile is tracked; nothing to lint"
            exit 0
          fi
          printf 'linting %s\n' "${files[@]}"
          hadolint --failure-threshold warning --format tty "${files[@]}"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check-catalog.py
      - run: uv run python scripts/check-docs-governance.py
      - name: Every place that names the release version agrees (a v* tag can never be corrected)
        run: uv run python scripts/check-release-version.py
      - run: bash scripts/check-versions.sh
      - name: uv.lock matches pyproject.toml and both requirements exports
        run: bash scripts/check-lockfiles.sh
      - name: The appliance refuses to start without the azure extra (default set)
        run: |
          set +e
          CA_SCOPES=/subscriptions/00000000-0000-0000-0000-000000000001 uv run python -m cloud_assessor_appliance
          code=$?
          set -e
          test "$code" -eq 3 && echo "refused as expected (exit $code)"
      - name: No ClientSecretCredential anywhere in the application
        run: |
          set -euo pipefail
          if grep -rn "ClientSecretCredential\|CertificateCredential\|UsernamePasswordCredential" src packages; then echo "::error::a client-secret credential path exists"; exit 1; fi
          echo "managed identity only"

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages --extra azure
      - name: Unit, security and packaging tests with the 85 percent coverage gate
        run: uv run pytest -q --cov=packages --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, if-no-files-found: error }
  catalog-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages
      - run: uv run python scripts/check-catalog.py
      - name: schema.json is generated from the model (drift check)
        run: |
          set -euo pipefail
          cp packages/cloud-assessor-core/catalog/schema.json /tmp/schema.before.json
          uv run python scripts/check-catalog.py --write-schema
          diff -u /tmp/schema.before.json packages/cloud-assessor-core/catalog/schema.json
  boundary:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --all-packages
      - name: Security and packaging suites on the default set (no cloud SDK installed)
        run: uv run pytest tests/security tests/packaging -q
  terraform:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_wrapper: false }
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/appliance-azure init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform/appliance-azure validate
      - name: Plan-only guard tests with mock providers (no login, no cloud call)
        run: terraform -chdir=infrastructure/terraform/appliance-azure test
  image:
    runs-on: ubuntu-26.04
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the lab boundary-proof target (never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, target: lab, load: true, push: false, tags: "hcw-cloud-assessor-lab:dev" }
      - name: Build the appliance target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: { context: ., file: infrastructure/docker/Dockerfile, target: appliance, load: true, push: false, tags: "hcw-cloud-assessor-appliance:dev" }
      - name: Boundary proved at image level (section 20)
        run: |
          set -euo pipefail
          docker run --rm hcw-cloud-assessor-lab:dev
          if docker run --rm hcw-cloud-assessor-lab:dev python -c "import azure"; then echo "::error::azure is importable in the lab target"; exit 1; fi
          if docker run --rm hcw-cloud-assessor-lab:dev python -m pip --version; then echo "::error::pip is present in the lab target"; exit 1; fi
          docker run --rm hcw-cloud-assessor-appliance:dev python -c "import azure.identity, azure.mgmt.resourcegraph, azure.mgmt.costmanagement; print('appliance: azure extra present')"
          if docker run --rm hcw-cloud-assessor-appliance:dev python -m pip --version; then echo "::error::pip is present in the appliance image"; exit 1; fi
          test "$(docker run --rm hcw-cloud-assessor-appliance:dev id -u)" = "10001"
          if docker run --rm -e AZURE_CLIENT_SECRET=x -e CA_SCOPES=/subscriptions/00000000-0000-0000-0000-000000000001 hcw-cloud-assessor-appliance:dev; then echo "::error::the appliance started with a client secret in the environment"; exit 1; fi
          if docker run --rm hcw-cloud-assessor-appliance:dev; then echo "::error::the appliance started without CA_SCOPES"; exit 1; fi
          echo "boundary proved in both directions"
