# Actions are pinned to full commit SHAs (version in the trailing comment); Dependabot (github-actions ecosystem) proposes updates.
# On every v* tag: first check that the tag, every package version, the changelog and the tagged commit agree
# (scripts/check-release-version.py; nothing is built, attested or attached if they do not;
# a manual run, the dry run before a tag, runs the SAME checks with --rehearse: the tag is taken to be v + the package
# version, so a dry run is red for everything a tag would be refused for, including entries left under [Unreleased];
# the v0.3.1 tag was refused for exactly that after a green dry run that never read the changelog), then build the
# cloud-assessor-core wheel and sdist, verify the wheel carries no cloud SDK and no Azure endpoint, attach both to the
# GitHub Release (release.yml creates it), attest provenance. PyPI trusted publishing is
# gated on the repository variable PYPI_ENABLED == 'true' [REVIEW REQUIRED]: `uv publish --trusted-publishing always`
# exchanges the job's OIDC token with PyPI; no registry token exists anywhere (docs: REFACTOR_APP.md 7.13, 11).
# The AddOn pins the wheel this job attaches to the release, by URL and sha256
# (https://github.com/saulpatinojr/HCW-CloudAssessor_App/releases/download/vX.Y.Z/cloud_assessor_core-X.Y.Z-py3-none-any.whl,
# `uv lock` records the hash; AddOn core-update.yml bumps the tag), whether or not PyPI publishing is enabled. A git+https pin
# cannot be verified by the AddOn image's `pip install --require-hashes`, which is why the asset, not the tag, is the contract.
name: publish-core
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-verify-attach:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.15" }
      - run: python -m pip install "uv==0.13.7"
      - name: The tag, the versions and the changelog agree (a dry run runs the same checks as the tag)
        env: { REF_TYPE: "${{ github.ref_type }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then mode=(--tag "$REF_NAME"); else mode=(--rehearse); fi
          python scripts/check-release-version.py "${mode[@]}" --ancestor-of origin/main
      - run: uv build --no-create-gitignore --package cloud-assessor-core --out-dir dist
      - name: Only the wheel and the sdist for this version were built, and the wheel's own version agrees
        env: { REF_TYPE: "${{ github.ref_type }}", REF_NAME: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then mode=(--tag "$REF_NAME"); else mode=(--rehearse); fi
          python scripts/check-release-version.py "${mode[@]}" --dist dist
      - name: The wheel carries the catalog, no cloud SDK import and no Azure endpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, zipfile, re, sys
          wheel = glob.glob("dist/cloud_assessor_core-*.whl")[0]
          z = zipfile.ZipFile(wheel)
          names = z.namelist()
          assert any(n.endswith("catalog_data/criteria.json") for n in names), "catalog missing from the wheel"
          for n in names:
              if n.endswith(".py"):
                  text = z.read(n).decode()
                  assert not re.search(r"^\s*(import|from)\s+(azure|msal|boto3)\b", text, re.M), f"{n} imports a cloud SDK"
                  for ep in ("management.azure.com", "login.microsoftonline.com", "graph.microsoft.com"):
                      assert ep not in text, f"{n} references {ep}"
          print("wheel verified:", wheel, len(names), "files")
          PY
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { subject-path: "dist/*" }
      - name: Attach the wheel and sdist to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          for i in 1 2 3 4 5 6; do gh release view "$tag" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "$tag" dist/* --clobber
      - name: PyPI trusted publishing (repository variable PYPI_ENABLED) [REVIEW REQUIRED]
        if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_ENABLED == 'true'
        run: uv publish --trusted-publishing always dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: cloud-assessor-core-dist, path: dist, if-no-files-found: error }
