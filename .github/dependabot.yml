version: 2
updates:
  # uv ecosystem (not pip): uv.lock is the source of truth and the pip ecosystem never edits it, so every pip pull
  # request failed `uv lock --check`. The engine package is a workspace member (pyproject.toml [tool.uv.workspace]), so this
  # one entry covers it too. The two requirements*.lock.txt files are generated from uv.lock (scripts/export-lockfiles.sh)
  # and excluded here: left in scope, Dependabot read them as hand-written requirements files and moved versions in them
  # alone (#79, #80). .github/workflows/dependabot-lockfiles.yml regenerates them on each Dependabot pull request.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    exclude-paths:
      - "requirements.lock.txt"
      - "requirements-azure.lock.txt"
    groups:
      # The Azure SDK ships as many per-service packages (T-009 note): one weekly PR for the `azure` extra.
      azure-sdk: { patterns: ["azure-*", "msal*", "msrest*"] }
      dev: { dependency-type: development }
      # pydantic pins pydantic-core to one exact version, so the two must move in one pull request; a pydantic-core bump
      # on its own cannot resolve against the pinned pydantic.
      pydantic: { patterns: ["pydantic", "pydantic-core"] }
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule: { interval: weekly }
    groups:
      # One weekly pull request for every action. Without it, codeql-action/init and codeql-action/analyze (one action
      # that must stay on one version) arrived as two pull requests that each left the pair split (#82, #83).
      github-actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule: { interval: weekly }
    # The Python base image is a pair: infrastructure/docker/versions.env holds the image and its digest, and
    # scripts/check-versions.sh (run by CI and `make lint`) fails unless every FROM matches it. Dependabot edits only the
    # Dockerfile, so each of its Python image pull requests fails that check by design, and the project requires
    # Python >=3.14.6,<3.16, so a 3.15 image would run it but still fail the digest check. The image is moved by hand,
    # in one change, with the digest.
    ignore:
      - dependency-name: "python"
  - package-ecosystem: terraform
    directory: /infrastructure/terraform/appliance-azure
    schedule: { interval: weekly }
