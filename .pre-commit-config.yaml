# T-015: the same checks as CI (ruff, ruff-format, gitleaks). Install with `uv run pre-commit install` after adding
# pre-commit to the dev group, or run the three commands by hand. Revisions are tags of the hook repositories:
# ruff-pre-commit mirrors the ruff release pinned in pyproject.toml (ruff==0.17.1); the gitleaks tag is the release
# security.yml runs in CI (8.24.3, printed by gitleaks-action in the job log; a published tag, checked 2026-10-24).
# Move all three together when either is bumped.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
