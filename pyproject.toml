[project]
name = "cloud-assessor-appliance"
version = "0.3.2"
description = "Hybrid Cloud Works Cloud Assessor, appliance edition: a continuous assessment of the client's own Azure scope (Resource Graph and Cost Management under a user-assigned managed identity) against paraphrased FinOps, Well-Architected cost and Zero Trust criteria."
readme = "README.md"
license = "MIT"
requires-python = ">=3.15.0,<3.16"
dependencies = [
  "cloud-assessor-core",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
# The only place a cloud SDK is allowed. Never a dependency of the core, never in the default set (tests/packaging).
azure = [
  "azure-identity==1.27.0",
  "azure-mgmt-resourcegraph==8.0.1",
  "azure-mgmt-costmanagement==5.0.0",
  # Entra access-token validation (src/cloud_assessor_appliance/security/entra.py): signature check with the tenant's
  # public keys only. Appliance-only like the SDKs above, so the default set and the lab stage never carry it.
  "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  # PyYAML 6.0.3, its newest release, publishes no wheel for CPython 3.15 (checked 2026-11-12; upstream
  # https://github.com/yaml/pyyaml/issues/951), so `uv sync` builds it from its source archive, which uv.lock pins by
  # sha256, with the build tools pinned in [tool.uv] below. Only the tests read YAML (test_workflows.py,
  # test_community_files.py and test_repository_admin_required_checks.py under tests/unit); neither image carries it.
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_assessor_appliance"]

[tool.uv]
workspace = { members = ["packages/cloud-assessor-core"] }
# Exact versions of the tools uv uses to build PyYAML 6.0.3 from its source archive, which it must do on Python 3.15
# because PyYAML has no 3.15 wheel yet (see the dev group above). Without these, each build fetched whatever setuptools
# and Cython were newest that day. Added 2026-11-12; checked to build PyYAML 6.0.3 on CPython 3.15.2. Delete this line
# once PyYAML publishes a cp315 wheel (https://github.com/yaml/pyyaml/issues/951; TODO.md T-035).
build-constraint-dependencies = ["setuptools==84.2.1", "cython==3.3.1"]

[tool.uv.sources]
cloud-assessor-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/cloud-assessor-core/tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:cloud_assessor_core",
  "error::DeprecationWarning:cloud_assessor_appliance",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this repository pins, so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["packages/cloud-assessor-core/src", "src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
