[project]
name = "cloud-assessor-appliance"
version = "0.1.0"
description = "Hybrid Cloud Works Cloud Assessor, appliance edition: a continuous assessment of the client's own Azure scope (Resource Graph and Cost Management under a user-assigned managed identity) against paraphrased FinOps, Well-Architected cost and Zero Trust criteria."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.6,<3.15"
dependencies = [
  "cloud-assessor-core",
  "fastapi==0.159.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
# The only place a cloud SDK is allowed. Never a dependency of the core, never in the default set (tests/packaging).
azure = [
  "azure-identity==1.26.0",
  "azure-mgmt-resourcegraph==8.0.1",
  "azure-mgmt-costmanagement==5.0.0",
  # Entra access-token validation (src/cloud_assessor_appliance/security/entra.py): signature check with the tenant's
  # public keys only. Appliance-only like the SDKs above, so the default set and the lab stage never carry it.
  "pyjwt[crypto]==2.15.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_assessor_appliance"]

[tool.uv]
workspace = { members = ["packages/cloud-assessor-core"] }

[tool.uv.sources]
cloud-assessor-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/cloud-assessor-core/tests"]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:cloud_assessor_core",
  "error::DeprecationWarning:cloud_assessor_appliance",
  # starlette 1.7 prefers httpx2 for its TestClient; httpx is the client this repository pins, so the notice is muted
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["packages/cloud-assessor-core/src", "src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
