[project]
name = "cloud-assessor-core"
version = "0.3.2"
description = "Cloud Assessor engine: a declarative criteria catalog evaluated over a normalised Azure Resource Graph export. Pure functions, pydantic only, no cloud SDK."
readme = "README.md"
license = "MIT"
# PEP 639: the wheel and the sdist carry the licence text, named in METADATA as License-File. The glob is resolved from
# this folder and may not climb out of it with "..", so LICENSE here is a byte copy of the root one;
# tests/packaging/test_core_wheel.py fails if the copy drifts or leaves either archive.
license-files = ["LICENSE"]
requires-python = ">=3.15.2,<3.16"
dependencies = [
  "pydantic>=2.14,<3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_assessor_core"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "cloud_assessor_core/catalog_data"
